<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Dashboard — ShopX</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/seller.css">
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="/pages/products.html" class="navbar-brand">ShopX</a>
    <div class="navbar-links">
      <a href="/pages/products.html" class="navbar-link">Products</a>
      <a href="/pages/orders.html" class="navbar-link">Orders</a>
      <a href="/pages/seller-dashboard.html" class="navbar-link active">Seller</a>
      <a href="#" class="navbar-link" id="logoutBtn">Logout</a>
    </div>
  </nav>

  <!-- ADD PRODUCT MODAL -->
  <div class="modal-overlay" id="productModal" style="display:none">
    <div class="modal">
      <div class="modal-title">
        <span id="modalTitle">Add Product</span>
        <button class="modal-close" onclick="closeProductModal()">✕</button>
      </div>
      <div class="modal-form">
        <div>
          <label class="modal-label">Product Name</label>
          <input class="modal-input" id="prodName" placeholder="iPhone 15 Pro" />
        </div>
        <div>
          <label class="modal-label">Description</label>
          <textarea class="modal-textarea" id="prodDesc" placeholder="Product description..."></textarea>
        </div>
        <div>
          <label class="modal-label">Category</label>
          <select class="modal-select" id="prodCategory">
            <option value="">Select category</option>
          </select>
        </div>
        <div class="form-row">
          <div>
            <label class="modal-label">Price (₹)</label>
            <input class="modal-input" id="prodPrice" type="number" placeholder="79999" />
          </div>
          <div>
            <label class="modal-label">Compare Price (₹)</label>
            <input class="modal-input" id="prodComparePrice" type="number" placeholder="89999 (optional)" />
          </div>
        </div>
        <div class="form-row">
          <div>
            <label class="modal-label">Stock Quantity</label>
            <input class="modal-input" id="prodStock" type="number" placeholder="50" />
          </div>
          <div>
            <label class="modal-label">SKU (optional)</label>
            <input class="modal-input" id="prodSku" placeholder="IPHONE-15-PRO" />
          </div>
          <div>
            <label class="modal-label">Product Image (optional)</label>
            <input type="file" id="prodImage" accept="image/*" style="width:100%; padding:8px; background:var(--bg-secondary);
           border:1px solid var(--border); border-radius:var(--radius-sm);
           color:var(--text-secondary); font-size:13px; cursor:pointer;" />
          </div>
        </div>
        <button class="btn-modal-submit" onclick="saveProduct()">
          Save Product
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="seller-container" id="mainContent">
    <p style="color:var(--text-secondary)">Loading...</p>
  </div>

  <div class="toast-container"></div>

  <script type="module">
    import { api } from '../js/api.js'
    import { requireAuth, getUser, removeToken, showToast } from '../js/utils.js'

    requireAuth()

    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
      e.preventDefault()
      await api.auth.logout()
      removeToken()
      window.location.href = '/pages/login.html'
    })

    // state
    let sellerProfile = null
    let editingProductId = null
    let categories = []

    // load categories for product form
    const loadCategories = async () => {
      const result = await api.categories.getAll()
      if (!result.categories) return

      const flat = []
      const flatten = (cats) => {
        cats.forEach(cat => {
          flat.push(cat)
          if (cat.children?.length) flatten(cat.children)
        })
      }
      flatten(result.categories)
      categories = flat

      const select = document.getElementById('prodCategory')
      if (select) {
        select.innerHTML = '<option value="">Select category</option>' +
          flat.map(c => `<option value="${c.id}">${c.name}</option>`).join('')
      }
    }

    // load seller dashboard
    const loadDashboard = async () => {
      // check if seller profile exists
      const profileResult = await api.seller.getProfile()

      if (!profileResult.seller) {
        renderCreateProfile()
        return
      }

      sellerProfile = profileResult.seller

      // pending approval
      if (sellerProfile.status === 'PENDING') {
        renderPendingApproval()
        return
      }

      // suspended
      if (sellerProfile.status === 'SUSPENDED') {
        renderSuspended()
        return
      }

      // approved - load dashboard
      const dashResult = await api.seller.getDashboard()
      if (dashResult.dashboard) {
        renderDashboard(dashResult.dashboard)
      }
    }

    // render create profile
    const renderCreateProfile = () => {
      document.getElementById('mainContent').innerHTML = `
        <div class="page-header">
          <div>
            <h1 class="page-title">Become a Seller</h1>
            <p class="page-subtitle">Create your seller profile to start selling</p>
          </div>
        </div>

        <div class="section" style="max-width:500px;">
          <div class="modal-form">
            <div>
              <label class="modal-label">Shop Name</label>
              <input class="modal-input" id="shopName" placeholder="My Awesome Shop" />
            </div>
            <div>
              <label class="modal-label">Shop Description</label>
              <textarea class="modal-textarea" id="shopDesc"
                placeholder="Tell customers about your shop..."></textarea>
            </div>
            <div>
              <label class="modal-label">GSTIN (optional)</label>
              <input class="modal-input" id="shopGstin"
                placeholder="29ABCDE1234F1Z5" />
            </div>
            <button class="btn-modal-submit" onclick="createSellerProfile()">
              Create Seller Profile
            </button>
          </div>
        </div>
      `
    }

    // render pending approval
    const renderPendingApproval = () => {
      document.getElementById('mainContent').innerHTML = `
        <div class="pending-approval">
          <div class="pending-approval-icon">⏳</div>
          <h2>Pending Admin Approval</h2>
          <p>Your seller profile is under review. We'll notify you once approved.</p>
          <p style="margin-top:8px; color:var(--text-muted);">
            Shop: <strong style="color:var(--text-primary)">${sellerProfile.shop_name}</strong>
          </p>
        </div>
      `
    }

    // render suspended
    const renderSuspended = () => {
      document.getElementById('mainContent').innerHTML = `
        <div class="pending-approval">
          <div class="pending-approval-icon">🚫</div>
          <h2>Account Suspended</h2>
          <p>Your seller account has been suspended. Please contact support.</p>
        </div>
      `
    }

    // render full dashboard
    const renderDashboard = (dashboard) => {
  const stats = dashboard.stats

  document.getElementById('mainContent').innerHTML = `

    <div class="page-header">
      <div>
        <h1 class="page-title">${sellerProfile.shop_name}</h1>
        <p class="page-subtitle">Seller Dashboard</p>
      </div>
      <span class="status-badge badge-approved">✓ Approved</span>
    </div>

    <!-- STATS -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">📦</div>
        <div class="stat-value">${stats.total_orders || 0}</div>
        <div class="stat-label">Total Orders</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">💰</div>
        <div class="stat-value">
          ₹${Number(stats.total_revenue || 0).toLocaleString('en-IN')}
        </div>
        <div class="stat-label">Total Revenue</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🛍️</div>
        <div class="stat-value">${stats.total_products || 0}</div>
        <div class="stat-label">Total Products</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">⚠️</div>
        <div class="stat-value">${stats.out_of_stock || 0}</div>
        <div class="stat-label">Out of Stock</div>
      </div>
    </div>

    <!-- TABS -->
    <div style="display:flex; gap:4px; background:var(--bg-secondary);
                padding:4px; border-radius:var(--radius-sm); margin-bottom:24px;">
      <button class="admin-tab-btn active"
        onclick="switchSellerTab('products', this)">
        My Products
      </button>
      <button class="admin-tab-btn"
        onclick="switchSellerTab('orders', this)">
        My Orders
      </button>
    </div>

    <!-- PRODUCTS TAB -->
    <div id="seller-tab-products">
      <div class="section">
        <div class="section-header">
          <h3 class="section-title">My Products</h3>
          <button class="btn-add-product" onclick="openAddProduct()">
            + Add Product
          </button>
        </div>
        <div id="productsTable">
          <p style="color:var(--text-muted); font-size:14px;">Loading...</p>
        </div>
      </div>
    </div>

    <!-- ORDERS TAB -->
    <div id="seller-tab-orders" style="display:none;">
      <div class="section">
        <div class="section-header">
          <h3 class="section-title">Orders for My Products</h3>
        </div>
        <div id="sellerOrdersTable">
          <p style="color:var(--text-muted); font-size:14px;">Loading...</p>
        </div>
      </div>
    </div>
  `

  loadSellerProducts()
}

    // load seller products
    const loadSellerProducts = async () => {

      const result = await api.products.getAll(
        `?seller_id=${sellerProfile.id}`
      )

      const container = document.getElementById('productsTable')
      if (!container) return

      if (!result.products || result.products.length === 0) {
        container.innerHTML =
          '<p style="color:var(--text-muted); font-size:14px;">No products yet. Add your first product!</p>'
        return
      }

      container.innerHTML = `
        <table class="data-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Price</th>
              <th>Stock</th>
              <th>Rating</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${result.products.map(p => `
              <tr>
                <td style="color:var(--text-primary); font-weight:500;">${p.name}</td>
                <td>₹${Number(p.price).toLocaleString('en-IN')}</td>
                <td>
                  <span style="color:${p.stock_quantity === 0
          ? 'var(--error)'
          : p.stock_quantity < 10
            ? 'var(--warning)'
            : 'var(--success)'}">
                    ${p.stock_quantity}
                  </span>
                </td>
                <td>${p.average_rating || 0} ★</td>
                <td>
                  <button
                    onclick="openEditProduct('${p.id}')"
                    style="background:var(--accent-light); color:var(--accent);
                           border:none; padding:4px 10px; border-radius:4px;
                           font-size:12px; cursor:pointer; margin-right:6px;">
                    Edit
                  </button>
                  <button
                    onclick="deleteProduct('${p.id}')"
                    style="background:rgba(239,68,68,0.1); color:var(--error);
                           border:none; padding:4px 10px; border-radius:4px;
                           font-size:12px; cursor:pointer;">
                    Delete
                  </button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `
    }

    // create seller profile
    window.createSellerProfile = async () => {
      const shop_name = document.getElementById('shopName').value.trim()
      const shop_description = document.getElementById('shopDesc').value.trim()
      const gstin = document.getElementById('shopGstin').value.trim()

      if (!shop_name) {
        showToast('Shop name is required', 'error')
        return
      }

      const result = await api.seller.createProfile({
        shop_name, shop_description, gstin
      })

      if (result.seller) {
        showToast('Seller profile created! Awaiting admin approval.')
        await loadDashboard()
      } else {
        showToast(result.message || 'Failed to create profile', 'error')
      }
    }

    // open add product modal
    window.openAddProduct = async () => {
      editingProductId = null
      document.getElementById('modalTitle').textContent = 'Add Product'
      document.getElementById('prodName').value = ''
      document.getElementById('prodDesc').value = ''
      document.getElementById('prodPrice').value = ''
      document.getElementById('prodComparePrice').value = ''
      document.getElementById('prodStock').value = ''
      document.getElementById('prodSku').value = ''
      await loadCategories()
      document.getElementById('productModal').style.display = 'flex'
    }

    // open edit product modal
    window.openEditProduct = async (productId) => {
      editingProductId = productId
      document.getElementById('modalTitle').textContent = 'Edit Product'

      const result = await api.products.getOne(productId)
      if (!result.product) return

      const p = result.product
      await loadCategories()

      document.getElementById('prodName').value = p.name
      document.getElementById('prodDesc').value = p.description
      document.getElementById('prodPrice').value = p.price
      document.getElementById('prodComparePrice').value = p.compare_price || ''
      document.getElementById('prodStock').value = p.stock_quantity
      document.getElementById('prodSku').value = p.sku || ''
      document.getElementById('prodCategory').value = p.category_id

      document.getElementById('productModal').style.display = 'flex'
    }

    // close product modal
    window.closeProductModal = () => {
      document.getElementById('productModal').style.display = 'none'
    }

    // save product
    window.saveProduct = async () => {
      const data = {
        name: document.getElementById('prodName').value.trim(),
        description: document.getElementById('prodDesc').value.trim(),
        category_id: document.getElementById('prodCategory').value,
        price: document.getElementById('prodPrice').value,
        compare_price: document.getElementById('prodComparePrice').value || null,
        stock_quantity: document.getElementById('prodStock').value,
        sku: document.getElementById('prodSku').value || null
      }

      if (!data.name || !data.description || !data.category_id ||
        !data.price || !data.stock_quantity) {
        showToast('Please fill all required fields', 'error')
        return
      }

      let result
      if (editingProductId) {
        result = await api.products.update(editingProductId, data)
      } else {
        result = await api.products.create(data)
      }

      if (result.product) {
        // upload image if selected
        const imageFile = document.getElementById('prodImage').files[0]
        if (imageFile) {
          const formData = new FormData()
          formData.append('image', imageFile)

          await fetch(
            `http://localhost:4000/api/v1/products/${result.product.id}/images`,
            {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${localStorage.getItem('accessToken')}`
              },
              body: formData
            }
          )
        }

        showToast(editingProductId ? 'Product updated!' : 'Product created!')
        closeProductModal()
        loadSellerProducts()
      } else {
        showToast(result.message || 'Failed to save product', 'error')
      }
    }

    // delete product
    window.deleteProduct = async (productId) => {
      if (!confirm('Are you sure you want to delete this product?')) return

      const result = await api.products.delete(productId)

      if (result.message == 'Product deleted successfully') {
        showToast('Product deleted')
        loadSellerProducts()
      } else {
        showToast(result.message || 'Failed to delete', 'error')
      }
    }

    // switch seller tabs
window.switchSellerTab = (tab, btn) => {
  document.querySelectorAll('.admin-tab-btn')
    .forEach(b => b.classList.remove('active'))
  btn.classList.add('active')

  document.getElementById('seller-tab-products').style.display =
    tab === 'products' ? 'block' : 'none'
  document.getElementById('seller-tab-orders').style.display =
    tab === 'orders' ? 'block' : 'none'

  if (tab === 'orders') loadSellerOrders()
}

// load seller orders
const loadSellerOrders = async () => {
  const result = await api.orders.getSellerOrders()
  const container = document.getElementById('sellerOrdersTable')
  if (!container) return

  if (!result.orders || result.orders.length === 0) {
    container.innerHTML =
      '<p style="color:var(--text-muted); font-size:14px;">No orders yet.</p>'
    return
  }

  container.innerHTML = `
    <table class="data-table">
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Customer</th>
          <th>Amount</th>
          <th>Payment</th>
          <th>Status</th>
          <th>Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        ${result.orders.map(order => `
          <tr>
            <td style="color:var(--text-primary); font-weight:600;
                       font-family:monospace;">
              #${order.id.slice(0, 8).toUpperCase()}
            </td>
            <td>${order.customer_name}</td>
            <td>₹${Number(order.final_amount).toLocaleString('en-IN')}</td>
            <td>
              <span style="color:${order.payment_status === 'PAID'
                ? 'var(--success)' : 'var(--warning)'}">
                ${order.payment_status}
              </span>
            </td>
            <td>
              <span class="status-badge status-${order.status}"
                style="padding:3px 10px; border-radius:20px; font-size:11px;
                       font-weight:600;">
                ${order.status.replace('_', ' ')}
              </span>
            </td>
            <td>${new Date(order.created_at).toLocaleDateString('en-IN')}</td>
            <td>
              ${getSellerOrderActions(order)}
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `
}

// get available actions for seller based on order status
const getSellerOrderActions = (order) => {
  const actions = {
    PENDING:    { next: 'CONFIRMED',   label: 'Confirm',  color: 'approve' },
    CONFIRMED:  { next: 'PROCESSING',  label: 'Process',  color: 'approve' },
    PROCESSING: { next: 'SHIPPED',     label: 'Ship',     color: 'approve' },
    SHIPPED:    { next: 'DELIVERED',   label: 'Delivered', color: 'approve' }
  }

  const action = actions[order.status]

  if (!action) {
    return `<span style="color:var(--text-muted); font-size:12px;">—</span>`
  }

  return `
    <button
      class="action-btn action-btn-${action.color}"
      onclick="updateSellerOrderStatus('${order.id}', '${action.next}')">
      ${action.label}
    </button>
  `
}

// update order status from seller
window.updateSellerOrderStatus = async (orderId, newStatus) => {
  const result = await api.orders.updateStatus(orderId, { status: newStatus })

  if (result.message) {
    showToast(`Order marked as ${newStatus.toLowerCase()}`)
    loadSellerOrders()
  } else {
    showToast(result.message || 'Failed to update order', 'error')
  }
}

    // init
    loadDashboard()
  </script>
</body>

</html>
